[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "q-nav"
version = "0.1.0"
description = "Quantum-Inertial Navigation Prototype: GPS-denied positioning using atom-interferometry-based quantum sensor models + EKF sensor fusion + gravity map matching"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pandas>=2.0",
]

[tool.setuptools.packages.find]
include = ["qnav*"]
